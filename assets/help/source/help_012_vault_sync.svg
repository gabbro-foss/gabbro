<svg xmlns="http://www.w3.org/2000/svg" width="337" height="728" viewBox="0 0 337 728" role="img" font-family="system-ui, 'Segoe UI', Roboto, DejaVu Sans, sans-serif">
  <title>Vault sync between devices</title>
  <desc>Device A exports the vault into a sync folder. Any file sync the user already has moves the encrypted file. Device B sets the sync folder once in Sync settings, then Sync from vault merges it in one tap.</desc>
  <defs>
    <marker id="varrow" markerWidth="9" markerHeight="9" refX="4" refY="4" orient="auto">
      <path d="M1,1 L7,4 L1,7 Z" fill="#5C7A3E"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="337" height="728" rx="6" fill="#5C7A3E"/>
  <rect x="8" y="8" width="321" height="712" rx="3" fill="#F8FAEF"/>

  <g transform="translate(145,17) scale(0.46)">
    <g transform="matrix(0.8825,0,0,0.8825,18.23,5)">
      <polygon points="0,40 24,40 24,96 10,102 0,90"         fill="#484844"/>
      <polygon points="24,40 52,40 52,96 24,96"              fill="#5A5A56"/>
      <polygon points="52,40 62,40 72,48 72,96 58,102 52,96" fill="#6C6860"/>
      <polygon points="0,12 18,0 24,0 24,40 0,40"            fill="#3E6030"/>
      <polygon points="24,0 52,0 52,40 24,40"                fill="#5C7A3E"/>
      <polygon points="52,0 62,0 62,40 52,40"                fill="#8ABE64"/>
      <line x1="24" y1="0" x2="24" y2="96" stroke="#2a2a28" stroke-width="0.9" opacity="0.6"/>
      <line x1="52" y1="0" x2="52" y2="96" stroke="#888480" stroke-width="0.7" opacity="0.5"/>
      <circle cx="38" cy="72" r="9" fill="none" stroke="#D4AA55" stroke-width="2.2"/><circle cx="38" cy="72" r="3.5" fill="#D4AA55"/>
    </g>
  </g>

  <text x="168" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#2E3826">Vault sync between devices</text>
  <text x="168" y="96" text-anchor="middle" font-size="10" fill="#6B7363">the same vault on device A and device B</text>

  <!-- spine -->
  <line x1="168" y1="176" x2="168" y2="192" stroke="#5C7A3E" stroke-width="1.6"/>
  <line x1="168" y1="212" x2="168" y2="228" stroke="#5C7A3E" stroke-width="1.6" marker-end="url(#varrow)"/>
  <line x1="168" y1="292" x2="168" y2="308" stroke="#5C7A3E" stroke-width="1.6"/>
  <line x1="168" y1="328" x2="168" y2="344" stroke="#5C7A3E" stroke-width="1.6" marker-end="url(#varrow)"/>
  <line x1="168" y1="408" x2="168" y2="424" stroke="#5C7A3E" stroke-width="1.6"/>
  <line x1="168" y1="444" x2="168" y2="460" stroke="#5C7A3E" stroke-width="1.6" marker-end="url(#varrow)"/>
  <line x1="168" y1="524" x2="168" y2="540" stroke="#5C7A3E" stroke-width="1.6"/>
  <line x1="168" y1="560" x2="168" y2="576" stroke="#5C7A3E" stroke-width="1.6" marker-end="url(#varrow)"/>
  <line x1="168" y1="620" x2="168" y2="640" stroke="#5C7A3E" stroke-width="1.6" marker-end="url(#varrow)"/>

  <!-- Device A -->
  <rect x="64" y="112" width="208" height="64" rx="10" fill="#FFFFFF" stroke="#5C7A3E" stroke-width="1.4"/>
  <rect x="84" y="124" width="24" height="40" rx="4" fill="#FFFFFF" stroke="#5C7A3E" stroke-width="1.4"/>
  <line x1="90" y1="130" x2="102" y2="130" stroke="#5C7A3E" stroke-width="1.4"/>
  <circle cx="96" cy="158" r="1.6" fill="#5C7A3E"/>
  <text x="122" y="140" font-size="13" font-weight="700" fill="#2E3826">Device A</text>
  <text x="122" y="156" font-size="10" fill="#6B7363">menu &#8250; Export</text>

  <rect x="44" y="192" width="248" height="20" rx="10" fill="#FFFFFF" stroke="#D9E0C8" stroke-width="1"/>
  <text x="168" y="206" text-anchor="middle" font-size="9" fill="#2E3826">writes <tspan font-family="'Fira Code', ui-monospace, monospace" font-weight="600">&lt;vault name&gt;.gabbro</tspan> into the sync folder</text>

  <!-- Sync folder -->
  <rect x="64" y="228" width="208" height="64" rx="10" fill="#EFF3E2" stroke="#5C7A3E" stroke-width="1.2" stroke-dasharray="4 3"/>
  <path d="M84 250 h10 l3 4 h17 v20 h-30 z" fill="#FFFFFF" stroke="#5C7A3E" stroke-width="1.4"/>
  <rect x="93" y="262" width="12" height="9" rx="1" fill="#C9A227"/>
  <path d="M96 262 v-2 a3 3 0 0 1 6 0 v2" fill="none" stroke="#C9A227" stroke-width="1.6"/>
  <text x="122" y="254" font-size="13" font-weight="700" fill="#2E3826">Sync folder</text>
  <text x="122" y="268" font-size="9" fill="#6B7363">shared by any file sync</text>
  <text x="122" y="280" font-size="9" fill="#6B7363">you already use</text>

  <rect x="98" y="308" width="140" height="20" rx="10" fill="#FFFFFF" stroke="#D9E0C8" stroke-width="1"/>
  <text x="168" y="322" text-anchor="middle" font-size="9" fill="#2E3826">the encrypted file arrives</text>

  <!-- Device B -->
  <rect x="64" y="344" width="208" height="64" rx="10" fill="#FFFFFF" stroke="#5C7A3E" stroke-width="1.4"/>
  <rect x="82" y="352" width="36" height="26" rx="2.5" fill="#FFFFFF" stroke="#5C7A3E" stroke-width="1.4"/>
  <rect x="97" y="378" width="6" height="5" fill="#5C7A3E"/>
  <line x1="90" y1="385" x2="110" y2="385" stroke="#5C7A3E" stroke-width="1.8" stroke-linecap="round"/>
  <text x="128" y="370" font-size="13" font-weight="700" fill="#2E3826">Device B</text>
  <text x="128" y="386" font-size="10" fill="#6B7363">menu &#8250; Sync settings</text>

  <rect x="44" y="424" width="248" height="20" rx="10" fill="#FFFFFF" stroke="#D9E0C8" stroke-width="1"/>
  <text x="168" y="438" text-anchor="middle" font-size="9" fill="#2E3826">once: choose the sync folder, switch on auto-merge</text>

  <!-- Sync from vault -->
  <rect x="64" y="460" width="208" height="64" rx="10" fill="#FFFFFF" stroke="#5C7A3E" stroke-width="1.4"/>
  <g transform="translate(100,492)">
    <path d="M-9,-2 A9,9 0 0 1 6,-7" fill="none" stroke="#5C7A3E" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M4,-10 l6.5,0.5 l-3.5,5.5 z" fill="#5C7A3E"/>
    <path d="M9,2 A9,9 0 0 1 -6,7" fill="none" stroke="#5C7A3E" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M-4,10 l-6.5,-0.5 l3.5,-5.5 z" fill="#5C7A3E"/>
  </g>
  <text x="122" y="486" font-size="13" font-weight="700" fill="#2E3826">Sync from vault</text>
  <text x="122" y="502" font-size="10" fill="#6B7363">one tap, every time after</text>

  <rect x="78" y="540" width="180" height="20" rx="10" fill="#FFFFFF" stroke="#D9E0C8" stroke-width="1"/>
  <text x="168" y="554" text-anchor="middle" font-size="9" fill="#2E3826">newer entries win, nothing is lost</text>

  <!-- YubiKey note -->
  <rect x="64" y="576" width="208" height="44" rx="10" fill="#FFFFFF" stroke="#5C7A3E" stroke-width="1.4"/>
  <rect x="86" y="588" width="10" height="20" rx="3" fill="#5A5A56" stroke="#2E3826" stroke-width="0.8"/>
  <circle cx="91" cy="591.5" r="1.5" fill="#F8FAEF"/>
  <circle cx="91" cy="601" r="2.6" fill="none" stroke="#D4AA55" stroke-width="1.4"/>
  <circle cx="91" cy="601" r="1" fill="#D4AA55"/>
  <text x="110" y="594" font-size="11" font-weight="700" fill="#2E3826">Key-protected vault?</text>
  <text x="110" y="608" font-size="9" fill="#6B7363">PIN + tap the key, then it merges</text>

  <rect x="70" y="640" width="196" height="42" rx="11" fill="#5C7A3E"/>
  <path d="M118 661 l5 6 l10 -13" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="140" y="666" font-size="13" font-weight="700" fill="#FFFFFF">Vaults in sync</text>

  <text x="168" y="704" text-anchor="middle" font-size="9" fill="#6B7363">Only the encrypted file ever leaves a device.</text>
</svg>
